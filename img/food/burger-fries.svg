<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" role="img" aria-label="Illustration of a half-pound burger with fries">
  <circle cx="200" cy="160" r="150" fill="#f3ead8"/>
  <ellipse cx="200" cy="284" rx="130" ry="13" fill="#22304b" opacity="0.10"/>
  <!-- fries cup -->
  <g transform="translate(268 128)">
    <g stroke-linecap="round">
      <rect x="6" y="-24" width="13" height="80" rx="6" fill="#f2c14e" transform="rotate(-9 12 16)"/>
      <rect x="24" y="-34" width="13" height="90" rx="6" fill="#eab84a"/>
