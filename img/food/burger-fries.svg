      <rect x="16" y="-14" width="13" height="70" rx="6" fill="#f6cf68" transform="rotate(-4 22 21)"/>
      <rect x="34" y="-16" width="13" height="72" rx="6" fill="#f6cf68" transform="rotate(4 40 20)"/>
    </g>
    <path d="M-4 34 h70 l-8 74 q-1 10 -12 10 h-30 q-11 0 -12 -10 z" fill="#a32c2e"/>
    <path d="M-4 34 h70 l-2 18 h-66z" fill="#872224"/>
