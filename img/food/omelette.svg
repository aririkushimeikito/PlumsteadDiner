  <!-- tomato garnish -->
  <circle cx="304" cy="216" r="14" fill="#d24d3e"/>
  <circle cx="304" cy="216" r="8" fill="#e4796b"/>
  <g fill="#5f8f4e">
    <circle cx="88" cy="222" r="6"/><circle cx="98" cy="214" r="5"/><circle cx="96" cy="228" r="5"/>
