  <!-- herbs on top -->
  <g fill="#5f8f4e">
    <rect x="168" y="160" width="14" height="4" rx="2" transform="rotate(-18 175 162)"/>
    <rect x="206" y="152" width="14" height="4" rx="2" transform="rotate(12 213 154)"/>
    <rect x="186" y="174" width="12" height="4" rx="2" transform="rotate(4 192 176)"/>
