    <rect x="150" y="210" width="18" height="9" rx="4" fill="#5f8f4e"/>
    <rect x="178" y="207" width="20" height="10" rx="4" fill="#d24d3e"/>
    <rect x="206" y="210" width="18" height="9" rx="4" fill="#f7d968"/>
