<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" role="img" aria-label="Illustration of a three-egg omelette with peppers and cheese">
  <circle cx="200" cy="160" r="150" fill="#f3ead8"/>
  <ellipse cx="200" cy="278" rx="128" ry="14" fill="#22304b" opacity="0.10"/>
  <ellipse cx="200" cy="190" rx="150" ry="88" fill="#fdfcf8" stroke="#e4ddcc" stroke-width="3"/>
  <ellipse cx="200" cy="190" rx="118" ry="66" fill="none" stroke="#eee7d6" stroke-width="2"/>
  <!-- omelette folded half-moon -->
  <path d="M92 196 q4 -50 58 -62 q56 -12 104 6 q46 17 50 48 q3 26 -28 30 l-156 4 q-26 -4 -28 -26z" fill="#f2c14e"/>
  <path d="M92 196 q2 22 28 26 l156 -4 q31 -4 28 -30 q-2 -14 -12 -24 q6 34 -34 38 l-130 4 q-30 0 -36 -10z" fill="#e0a832"/>
